name: TCU Platform CI & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-frontend:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend_new/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend_new
          npm ci

      - name: Build Next.js Application
        run: |
          cd frontend_new
          npm run build

  verify-backend:
    name: Test & Verify Backend API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tcu-backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd tcu-backend
          npm ci

      - name: Verify Backend Syntax & Imports
        run: |
          cd tcu-backend
          node -c server.js
