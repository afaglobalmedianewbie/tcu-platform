# Frontend (Next.js)
server {
    listen 80;
    server_name topclassuniversal.co.id www.topclassuniversal.co.id;

    # Disable Browser Cache globally for real-time updates
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP Forwarding dari Cloudflare DNS Proxy
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # Serve Roundcube on /webmail
    location ^~ /webmail {
        alias /var/www/mail.topclassuniversal.co.id;
        index index.php index.html;
        try_files $uri $uri/ /webmail/index.php?$args;

        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
        
        location ~ ^/webmail/(README.md|INSTALL|LICENSE|CHANGELOG.md|UPGRADING)$ {
            deny all;
        }
        location ~ ^/webmail/(config|temp|logs)/ {
            deny all;
        }
        location ~ /\. {
            deny all;
        }
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/topclassuniversal.co.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/topclassuniversal.co.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

