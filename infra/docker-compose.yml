version: "3.3"
services:
  wg-easy:
    environment:
      # Required:
      # Change this to your VPS's public IP or domain name
      - WG_HOST=topclassuniversal.co.id
      - UI_BASE_PATH=/vpn
      - PASSWORD_HASH=$$2b$$08$$tXOEI85Pb15HpLlxu2BxS.eYvDhhQJlsRHVznXCEIzZNjVuevkBZS
      - PORT=51821
      - WG_PORT=51820
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy
    volumes:
      - ./wireguard:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

